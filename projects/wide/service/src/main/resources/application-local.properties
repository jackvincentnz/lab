# Defaults match projects/wide/docker-compose.yml; the environment variables still override them.
spring.datasource.url=${WIDE_DATABASE_URL:jdbc:postgresql://127.0.0.1:5495/wide}
spring.datasource.username=${WIDE_DATABASE_USER:wide}
spring.datasource.password=${WIDE_DATABASE_PASSWORD:wide-local}

# The local database holds real notes with no authentication in front of it.
server.address=127.0.0.1
