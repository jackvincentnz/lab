name: wide

services:
  postgres:
    # A new major version cannot open this volume's data directory: move the data before merging a major bump.
    image: postgres:17.12@sha256:b60e90042aa6b8dbecd58e224b3e36114dbf8ad754465264c2476ad58a86e45c
    restart: unless-stopped
    ports:
      - "127.0.0.1:5495:5432"
    environment:
      POSTGRES_DB: wide
      POSTGRES_USER: wide
      POSTGRES_PASSWORD: wide-local
    volumes:
      - wide-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U wide -d wide"]
      interval: 2s
      timeout: 3s
      retries: 20

volumes:
  wide-db:
