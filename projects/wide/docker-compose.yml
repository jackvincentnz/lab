name: wide

services:
  postgres:
    # A new major version cannot open this volume's data directory: move the data before merging a major bump.
    image: postgres:17.12@sha256:97fb53376be3e4fb1a8a61421daa69dcc3bf2fa39bda3259f5245f9a455af1a9
    restart: unless-stopped
    ports:
      - "127.0.0.1:5495:5432"
    environment:
      POSTGRES_DB: wide
      POSTGRES_USER: wide
      POSTGRES_PASSWORD: wide-local
    volumes:
      - wide-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U wide -d wide"]
      interval: 2s
      timeout: 3s
      retries: 20

volumes:
  wide-db:
