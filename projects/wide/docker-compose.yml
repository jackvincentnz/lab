name: wide

services:
  postgres:
    # A new major version cannot open this volume's data directory: move the data before merging a major bump.
    image: postgres:19.0@sha256:4ea94de574c17f0372722806c949757050fbb1cd7648410fe45d6bba275cc00e
    restart: unless-stopped
    ports:
      - "127.0.0.1:5495:5432"
    environment:
      POSTGRES_DB: wide
      POSTGRES_USER: wide
      POSTGRES_PASSWORD: wide-local
    volumes:
      - wide-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U wide -d wide"]
      interval: 2s
      timeout: 3s
      retries: 20

volumes:
  wide-db:
