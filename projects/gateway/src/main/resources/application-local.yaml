# Local development only. Activated by the Bazel run target.
logging:
  structured:
    format:
      console: ""
lab:
  gateway:
    token:
      ephemeral-key: true
    users:
      - username: admin
        password: "{noop}admin"
        principal: "11111111-1111-1111-1111-111111111111"
        tenant: "22222222-2222-2222-2222-222222222222"
        scopes: ["mops:read", "mops:write"]
spring:
  security:
    oauth2:
      resourceserver:
        jwt:
          # Setting the JWK set URI too fetches only the keys and skips OIDC discovery.
          issuer-uri: http://localhost:${GATEWAY_ISSUER_PORT:3007}/lab
          jwk-set-uri: http://localhost:${GATEWAY_ISSUER_PORT:3007}/lab/jwks
