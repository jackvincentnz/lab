services:
  redis:
    image: redis:8.12.0-alpine@sha256:5af80107c1eeecb484a2269b80a26d12bfa6521787da4663bd9f19f60a163483
    ports:
      - "127.0.0.1:${GATEWAY_REDIS_PORT:-6379}:6379"
  mock-oauth2-server:
    image: ghcr.io/navikt/mock-oauth2-server:7.0.2@sha256:95966a61e512c003daa3c884623665c2bbf04f46f85ce97d7ee659384d804202
    ports:
      - "127.0.0.1:${GATEWAY_ISSUER_PORT:-3007}:8080"
    environment:
      JSON_CONFIG: >-
        {
          "tokenCallbacks": [
            {
              "issuerId": "lab",
              "tokenExpiry": 300,
              "requestMappings": [
                {
                  "requestParam": "grant_type",
                  "match": "client_credentials",
                  "claims": {
                    "sub": "11111111-1111-1111-1111-111111111111",
                    "aud": ["lab-gateway"],
                    "tenant": "22222222-2222-2222-2222-222222222222",
                    "scope": "mops:read mops:write"
                  }
                }
              ]
            }
          ]
        }
