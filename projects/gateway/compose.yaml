services:
  redis:
    image: redis:8.10.3-alpine@sha256:7958cfbb9d152f87dadfbc89f1b0b15938f0b81ff8982feb327476f4911935c3
    ports:
      - "127.0.0.1:${GATEWAY_REDIS_PORT:-6379}:6379"
  mock-oauth2-server:
    image: ghcr.io/navikt/mock-oauth2-server:7.0.1@sha256:eb07a0a65007c34c40c7b849592a47e6299128a514a5c6c582a53451cc6e3390
    ports:
      - "127.0.0.1:${GATEWAY_ISSUER_PORT:-3007}:8080"
    environment:
      JSON_CONFIG: >-
        {
          "tokenCallbacks": [
            {
              "issuerId": "lab",
              "tokenExpiry": 300,
              "requestMappings": [
                {
                  "requestParam": "grant_type",
                  "match": "client_credentials",
                  "claims": {
                    "sub": "11111111-1111-1111-1111-111111111111",
                    "aud": ["lab-gateway"],
                    "tenant": "22222222-2222-2222-2222-222222222222",
                    "scope": "mops:read mops:write"
                  }
                }
              ]
            }
          ]
        }
