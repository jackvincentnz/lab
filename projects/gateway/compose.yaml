services:
  redis:
    image: redis:8.10.3-alpine@sha256:21090af93f8324db2f0f0f4f38a7c60369d47d917e000c3423d89d2ae2883537
    ports:
      - "127.0.0.1:${GATEWAY_REDIS_PORT:-6379}:6379"
  mock-oauth2-server:
    image: ghcr.io/navikt/mock-oauth2-server:6.1.4@sha256:647dd8c78a54f0e6fcd58d79c884e612f8f998a0662276f3e1db22e464a50192
    ports:
      - "127.0.0.1:${GATEWAY_ISSUER_PORT:-3007}:8080"
    environment:
      JSON_CONFIG: >-
        {
          "tokenCallbacks": [
            {
              "issuerId": "lab",
              "tokenExpiry": 300,
              "requestMappings": [
                {
                  "requestParam": "grant_type",
                  "match": "client_credentials",
                  "claims": {
                    "sub": "11111111-1111-1111-1111-111111111111",
                    "aud": ["lab-gateway"],
                    "tenant": "22222222-2222-2222-2222-222222222222",
                    "scope": "mops:read mops:write"
                  }
                }
              ]
            }
          ]
        }
