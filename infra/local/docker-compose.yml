# Local port reservations, overridable with the variable in brackets:
# 3000: tasklist (ORGANIZER_TASKLIST_PORT)
# 3001: task (ORGANIZER_TASK_PORT)
# 3002: autojournal (ORGANIZER_AUTOJOURNAL_PORT)
# 3003: journal (ORGANIZER_JOURNAL_PORT)
# 3004: journal_app (ORGANIZER_JOURNAL_APP_PORT)
# 3005: bubbles
# 4000: router (ORGANIZER_ROUTER_PORT)
# 8080: proxy (ORGANIZER_PROXY_PORT)
# 8081: schema registry (ORGANIZER_SCHEMA_REGISTRY_PORT)
# 9092: Kafka (ORGANIZER_KAFKA_PORT)

---
services:
  broker:
    image: confluentinc/cp-kafka:8.3.2@sha256:5e8f3ab5b4977c9a8fd6137d26af2caad878aca316f24c55f08206217e3cec48
    container_name: broker
    ports:
      - "${ORGANIZER_KAFKA_PORT:-9092}:9092"
    environment:
      CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qk
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@broker:29093
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT_INTERNAL
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,PLAINTEXT_INTERNAL://broker:29092,CONTROLLER://broker:29093
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_INTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:${ORGANIZER_KAFKA_PORT:-9092},PLAINTEXT_INTERNAL://broker:29092
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
    healthcheck:
      test: kafka-broker-api-versions --bootstrap-server localhost:9092
      interval: 5s
      timeout: 10s
      retries: 10

  schema-registry:
    image: confluentinc/cp-schema-registry:8.3.2@sha256:482d3048b3f6029bae5794b5c3b5e2eea8d61ca064dacd32241315e818fd8d7c
    hostname: schema-registry
    container_name: schema-registry
    depends_on:
      - broker
    ports:
      - "${ORGANIZER_SCHEMA_REGISTRY_PORT:-8081}:8081"
    environment:
      SCHEMA_REGISTRY_HOST_NAME: schema-registry
      SCHEMA_REGISTRY_KAFKASTORE_BOOTSTRAP_SERVERS: "broker:29092"

  task:
    image: jackvincent/lab-task:latest
    hostname: task
    container_name: task
    depends_on:
      broker:
        condition: service_healthy
    ports:
      - "${ORGANIZER_TASK_PORT:-3001}:3001"
    environment:
      SPRING_KAFKA_BOOTSTRAP_SERVERS: "broker:29092"
      SPRING_KAFKA_PROPERTIES_SCHEMA_REGISTRY_URL: http://schema-registry:8081

  journal:
    image: jackvincent/lab-journal:latest
    hostname: journal
    container_name: journal
    ports:
      - "${ORGANIZER_JOURNAL_PORT:-3003}:3003"

  autojournal:
    image: jackvincent/lab-autojournal:latest
    hostname: autojournal
    container_name: autojournal
    depends_on:
      broker:
        condition: service_healthy
      task:
        condition: service_started
      journal:
        condition: service_started
    ports:
      - "${ORGANIZER_AUTOJOURNAL_PORT:-3002}:3002"
    environment:
      LAB_SERVICES_TASK_GRAPHQL_URL: http://host.docker.internal:${ORGANIZER_TASK_PORT:-3001}/graphql
      LAB_SERVICES_JOURNAL_GRAPHQL_URL: http://host.docker.internal:${ORGANIZER_JOURNAL_PORT:-3003}/graphql
      SPRING_KAFKA_BOOTSTRAP_SERVERS: "broker:29092"
      SPRING_KAFKA_PROPERTIES_SCHEMA_REGISTRY_URL: http://schema-registry:8081
    extra_hosts:
      - "host.docker.internal:host-gateway"

  tasklist:
    image: jackvincent/lab-tasklist:latest
    hostname: tasklist
    container_name: tasklist
    ports:
      - "${ORGANIZER_TASKLIST_PORT:-3000}:80"

  journal_app:
    image: jackvincent/lab-journal-app:latest
    hostname: journal_app
    container_name: journal_app
    ports:
      - "${ORGANIZER_JOURNAL_APP_PORT:-3004}:80"

  proxy:
    image: lab/proxy:latest
    hostname: proxy
    container_name: proxy
    depends_on:
      - router
      - tasklist
      - journal_app
    ports:
      - "${ORGANIZER_PROXY_PORT:-8080}:8080"
    environment:
      NGINX_PORT: 8080
      TASK_APP_HOST: http://host.docker.internal:${ORGANIZER_TASKLIST_PORT:-3000}
      JOURNAL_APP_HOST: http://host.docker.internal:${ORGANIZER_JOURNAL_APP_PORT:-3004}
      ROUTER_HOST: http://host.docker.internal:${ORGANIZER_ROUTER_PORT:-4000}
    extra_hosts:
      - "host.docker.internal:host-gateway"

  router:
    image: ghcr.io/apollographql/router:v2.18.0@sha256:5b02af03e8f0268b8fcf85132c9e54ea36a1029b0823b00bb9151f698a991215
    hostname: router
    container_name: router
    depends_on:
      - task
      - journal
    ports:
      - "${ORGANIZER_ROUTER_PORT:-4000}:4000"
    volumes:
      - type: bind
        source: ./router/schema/supergraph.graphql
        target: /dist/schema/local.graphql
      - type: bind
        source: ./router/config/router.conf
        target: /dist/config/router.conf
    environment:
      APOLLO_ROUTER_SUPERGRAPH_PATH: schema/local.graphql
      APOLLO_ROUTER_CONFIG_PATH: config/router.conf
      TASK_ROUTING_URL: http://host.docker.internal:${ORGANIZER_TASK_PORT:-3001}/graphql
      JOURNAL_ROUTING_URL: http://host.docker.internal:${ORGANIZER_JOURNAL_PORT:-3003}/graphql
    command: --hot-reload
    extra_hosts:
      - "host.docker.internal:host-gateway"
